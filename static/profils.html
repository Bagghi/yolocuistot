<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOLO cuistot : les fiches</title>
  <link rel="icon" type="image/png" href="/logos/favicon.png">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="bandeau bandeau-compact">
    <img class="logo" src="/logos/logo-fds-bleu-transparent.png" alt="Fête de la Science">
    <div class="titre">
      <div class="titre-logo">
        <img class="logo-yolo" src="/logos/logo_yolo_cuistot_site.png" alt="YOLO Cuistot">
        <p>Les fiches du stand</p>
      </div>
    </div>
    <img class="logo" src="/logos/logo_couleur_ua.png" alt="Université des Antilles">
  </header>

  <nav class="liens"><a href="/">← Retour à l'accueil</a></nav>

  <main class="fiches">
    <section class="panneau section-fiches">
      <h2>🎒 Les fiches élèves</h2>
      <p class="aide">Objectifs nutritionnels pour la journée.</p>
      <div id="grille-eleves" class="grille-profils" style="margin-top:14px"></div>
    </section>

    <section class="panneau section-fiches">
      <h2>🧑‍🏫 Les fiches professionnels</h2>
      <p class="aide">Objectifs nutritionnels pour la journée.</p>
      <div id="grille-professionnels" class="grille-profils" style="margin-top:14px"></div>
    </section>

    <section class="panneau section-fiches">
      <h2>📋 Les fiches aliments</h2>
      <p class="aide">Apports pour 100 g de chaque aliment.</p>
      <div style="overflow-x:auto">
        <table class="tableau-aliments">
          <thead>
            <tr>
              <th>Aliment</th><th>Portion</th>
              <th class="nombre">Glucides</th><th class="nombre">Fibres</th><th class="nombre">Protéines</th><th class="nombre">Lipides</th>
            </tr>
          </thead>
          <tbody id="corps-aliments"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/js/commun.js"></script>
  <script>
    (async () => {
      const [profils, aliments] = await Promise.all([api("/api/profils"), api("/api/aliments")]);
      const cartes = (visiteurs) => profils.filter((p) => p.public === visiteurs).map((p) => carteProfil(p)).join("");
      document.getElementById("grille-eleves").innerHTML = cartes("eleve");
      document.getElementById("grille-professionnels").innerHTML = cartes("adulte");
      document.getElementById("corps-aliments").innerHTML = [...aliments]
        .sort((a, b) => a.nom.localeCompare(b.nom, "fr"))
        .map((a) => `
          <tr>
            <td>${esc(a.nom)}</td>
            <td>${esc(a.unite_portion)}</td>
            ${CATEGORIES.map(([cle]) => `<td class="nombre">${nombre(a.apports[cle], 1)} g</td>`).join("")}
          </tr>`).join("");
    })();
  </script>
</body>
</html>
